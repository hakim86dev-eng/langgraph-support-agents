[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "langgraph-support-agents"
version = "0.1.0"
description = "Multi-agent customer-support backend: LangGraph planner, tool-using workers and a reviewer behind FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hakim Rashid", email = "hakimrashid207@gmail.com" }]
keywords = ["langgraph", "langchain", "agents", "multi-agent", "fastapi", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langchain-core>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
ollama = ["langchain-ollama>=1.0"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "C4", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langchain_openai.*", "langchain_anthropic.*", "langchain_ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["support_agents"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
