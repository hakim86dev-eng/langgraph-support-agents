name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: mypy src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing --cov-report=xml

  providers:
    name: Provider extras import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[openai,anthropic,ollama]"
      - name: Build the graph with each real provider (no network calls)
        env:
          OPENAI_API_KEY: sk-ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
        run: |
          python - <<'PY'
          from support_agents.config import Settings
          from support_agents.graph import build_graph
          from support_agents.llm import create_chat_model
          from support_agents.tools import build_toolkit
          for provider, model in [("openai", "gpt-4o-mini"), ("anthropic", "claude-sonnet-4-5"), ("ollama", "llama3.1")]:
              llm = create_chat_model(Settings(llm_provider=provider, model=model))
              build_graph(llm, build_toolkit())
              print(provider, type(llm).__name__, "ok")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: langgraph-support-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
