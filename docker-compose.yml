services:
  agents:
    build: .
    image: langgraph-support-agents:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_CHECKPOINT_DB: /data/checkpoints.sqlite
      AGENT_OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - checkpoints:/data
    restart: unless-stopped

  # Optional local model: docker compose --profile ollama up
  # then set AGENT_LLM_PROVIDER=ollama and AGENT_MODEL=llama3.1 in .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  checkpoints:
  ollama:
